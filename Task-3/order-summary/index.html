
<!DOCTYPE html>
<html>
<head>
    <title>Order Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Your Order</h1>
        <p class="intro">A little something for your workspace.</p>
        <div class="product">
            <img src="images/lamp.webp" alt="Desk Lamp">
            <div class="product-details">
                <h2>Luma Desk Lamp</h2>
                <p>Warm white</p>
                <p>Quantity: 1</p>
            </div>
            <h3>₹1,299</h3>
        </div>
        <div class="product">
            <img src="images/notebook.jpg" alt="Notebook">

            <div class="product-details">
                <h2>Daily Notes Journal</h2>
                <p>Sand beige</p>
                <p>Quantity: 1</p>
            </div>
            <h3>₹349</h3>
        </div>
        <div class="price-details">

            <div class="price-row">
                <p>Subtotal</p>
                <p>₹1,648</p>
            </div>
            <div class="price-row">
                <p>Delivery</p>
                <p>₹40</p>
            </div>
            <div class="price-row">
                <p>Discount</p>
                <p>-₹100</p>
            </div>
            <hr>
            <div class="price-row total">
                <h2>Total</h2>
                <h2>₹1,588</h2>
            </div>

        </div>
        <button>Place Your Order</button>
        <p class="footer">Thanks for choosing us!</p>
    </div>
</body>
</html>
